# Based on the official Apache Kafka 4.1.2 Docker Compose example (KRaft, isolated controllers, PLAINTEXT).
# https://github.com/apache/kafka/blob/4.1.2/docker/examples/docker-compose-files/cluster/isolated/plaintext/docker-compose.yml
# Application topics are created separately using create-topics.sh.
x-common-environment: &common-environment
  CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@controller-1:9093,2@controller-2:9093,3@controller-3:9093'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
  KAFKA_LOG_DIRS: '/var/lib/kafka/data'

x-controller: &controller
  image: apache/kafka:4.1.2
  cpus: '0.5'
  mem_limit: 1g

x-controller-environment: &controller-environment
  <<: *common-environment
  KAFKA_PROCESS_ROLES: 'controller'
  KAFKA_LISTENERS: 'CONTROLLER://:9093'
  KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'

x-broker: &broker
  image: apache/kafka:4.1.2
  cpus: '2.0'
  mem_limit: 4g
  depends_on:
    - controller-1
    - controller-2
    - controller-3

x-broker-environment: &broker-environment
  <<: *common-environment
  KAFKA_PROCESS_ROLES: 'broker'
  KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
  KAFKA_HEAP_OPTS: '-Xms1g -Xmx2g'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2

services:
  controller-1:
    <<: *controller
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 1
    volumes:
      - controller-1-data:/var/lib/kafka/data

  controller-2:
    <<: *controller
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 2
    volumes:
      - controller-2-data:/var/lib/kafka/data

  controller-3:
    <<: *controller
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 3
    volumes:
      - controller-3-data:/var/lib/kafka/data

  broker-1:
    <<: *broker
    ports:
      - '127.0.0.1:29092:9092'
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-1:19092,EXTERNAL://localhost:29092'
    volumes:
      - broker-1-data:/var/lib/kafka/data

  broker-2:
    <<: *broker
    ports:
      - '127.0.0.1:39092:9092'
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-2:19092,EXTERNAL://localhost:39092'
    volumes:
      - broker-2-data:/var/lib/kafka/data

  broker-3:
    <<: *broker
    ports:
      - '127.0.0.1:49092:9092'
    environment:
      <<: *broker-environment
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-3:19092,EXTERNAL://localhost:49092'
    volumes:
      - broker-3-data:/var/lib/kafka/data

volumes:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
